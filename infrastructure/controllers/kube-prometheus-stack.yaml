apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  releaseName: kube-prometheus-stack
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=65.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    alertmanager:
      enabled: false # lab: keep it light
    prometheus:
      prometheusSpec:
        # pick up ServiceMonitors from any namespace without a release label
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 2d
