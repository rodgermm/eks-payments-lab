apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-rollouts
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: argo-rollouts
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: argo-rollouts
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: argo
  values:
    dashboard:
      enabled: true
