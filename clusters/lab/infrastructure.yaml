# Flux entrypoint. `flux bootstrap` creates clusters/lab/flux-system/ next to this file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/controllers
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-karpenter
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/karpenter
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
